version: '3.8'

services:
  edge-proxy:
    image: carina_core-caddy:latest
    container_name: noxfort-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      - CARINA_DOMAIN=${CARINA_DOMAIN:-carinanoxfort}
      - CARINA_TOKEN=${CARINA_TOKEN:-ff528f24-1dd3-4c84-9c12-02b6d9805440}
      - MONITOR_DOMAIN=${MONITOR_DOMAIN:-noxfortmonitor}
      - MONITOR_TOKEN=${MONITOR_TOKEN:-2c42c374-2143-4292-93c3-5baccb6446c4}
      - ACME_EMAIL=${ACME_EMAIL:-admin@noxfort.local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./internal/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - noxfort_gateway_data:/data
      - noxfort_gateway_config:/config

volumes:
  noxfort_gateway_data:
  noxfort_gateway_config:
